<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background blanc -->
  <rect width="400" height="280" fill="white"/>
  
  <!-- Logo V Valloire -->
  <g id="logo-v">
    <!-- Partie gauche du V -->
    <polygon points="100,80 160,180 120,180" fill="#003D6B"/>
    <!-- Partie droite du V -->
    <polygon points="240,80 180,180 220,180" fill="#0066B2"/>
  </g>
  
  <!-- Montagne stylisée en haut du V -->
  <g id="mountain">
    <polygon points="170,40 185,70 155,70" fill="#003D6B"/>
  </g>
  
  <!-- Étoile rouge -->
  <g id="star" transform="translate(190, 55)">
    <polygon points="0,-12 3,-3 12,-1 5,5 7,14 0,9 -7,14 -5,5 -12,-1 -3,-3" fill="#E31E24"/>
  </g>
  
  <!-- Point blanc -->
  <circle cx="185" cy="95" r="4" fill="white"/>
  
  <!-- Texte VALLOIRE -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#003D6B" text-anchor="middle" letter-spacing="2">VALLOIRE</text>
  
  <!-- Texte GALIBIER -->
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#E31E24" text-anchor="middle" letter-spacing="4">GALIBIER</text>
</svg>